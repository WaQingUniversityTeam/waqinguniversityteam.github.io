<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站即将上线 - 蛙青大学</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 800px;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        .logo {
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .logo span { color: #3498db; }
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .status {
            display: inline-block;
            background: #e8f4fc;
            color: #3498db;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            margin: 1rem 0;
            font-weight: 500;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
            text-align: left;
        }
        .feature {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid #3498db;
        }
        .feature h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .countdown {
            background: #2c3e50;
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 2rem 0;
        }
        .countdown h3 { color: white; margin-bottom: 1rem; }
        .timer {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 2rem;
            font-weight: bold;
        }
        .timer span {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        .contact {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }
        .copyright {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">蛙青<span>大学</span></div>

        <h1>知识无界，学海有涯</h1>
        <div class="status">🚧 网站升级中</div>

        <p style="color: #555; line-height: 1.6; margin-bottom: 2rem;">
            网站即将上线，敬请期待！
        </p>

        <div class="features">
            <div class="feature">
                <h3>👥 社区交流</h3>
                <p>与技术爱好者共同学习，分享经验</p>
            </div>
            <div class="feature">
                <h3>💻 技术实践</h3>
                <p>从理论到实践，掌握实用技能</p>
            </div>
        </div>

        <div class="countdown">
            <h3>预计上线时间</h3>
            <div class="timer">
                <span id="days">00</span>天
                <span id="hours">00</span>时
                <span id="minutes">00</span>分
                <span id="seconds">00</span>秒
            </div>
        </div>

        <div class="contact">
            <p style="margin-bottom: 1rem;">📍 项目地址：</p>
            <p style="margin-bottom: 1rem;">
                <a href="https://github.com/WaQingUniversityTeam/waqinguniversityteam.github.io" style="color: #3498db; text-decoration: none; font-weight: 500;">
                    github.com/waqinguniversity
                </a>
            </p>
            <p style="color: #7f8c8d; font-size: 0.9rem;">
                邮箱：zhangxixi201268@outlook.com
            </p>
        </div>

        <div class="copyright">
            <p>Copyleft © 2025-2026 WaQingUniversityTeam GPLv3</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem;">
                本网站所有内容遵循 GNU 通用公共许可证第三版，允许自由使用、修改和分发
            </p>
        </div>

        <div class="powered-by">
            <span class="label">Powered by</span>
            <div class="logos">
                <img src="logo1.png" alt="Logo 1" class="logo">
                <img src="logo2.png" alt="Logo 2" class="logo">
                <!-- 可添加更多 -->
            </div>
        </div>
    </div>

    <style>
        .powered-by {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 14px;
          color: #666;
        }
        
        .logos {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        
        .logo {
          height: 24px; /* 统一高度 */
          width: auto;  /* 保持比例 */
          opacity: 0.8;
          transition: opacity 0.3s;
        }
        
        .logo:hover {
          opacity: 1;
        }
    </style>
    <script>
        // 倒计时功能
        const targetDate = new Date('2026-01-30T00:00:00').getTime();
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            if (distance < 0) {
                document.querySelector('.countdown').innerHTML = 
                    '<h3>🎉 网站已正式上线！</h3>';
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
        
        // 动态效果
        document.querySelectorAll('.feature').forEach(feature => {
            feature.addEventListener('mouseenter', () => {
                feature.style.transform = 'translateY(-5px)';
                feature.style.boxShadow = '0 10px 30px rgba(52, 152, 219, 0.2)';
            });
            feature.addEventListener('mouseleave', () => {
                feature.style.transform = 'translateY(0)';
                feature.style.boxShadow = 'none';
            });
        });
    </script>
</body>

</html>
